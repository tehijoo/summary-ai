server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;
    charset utf-8;

    # This location block handles all PHP requests *after* rewriting.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- NEW SECTION ---
    # This block intercepts all requests starting with /pbkk-b-7
    # It rewrites them and sends them back to the 'location /' block.

    # 1. Handle exact match for /pbkk-b-7 (no slash)
    location = /pbkk-b-7 {
        rewrite ^ / last;
    }
    
    # 2. Handle exact match for /pbkk-b-7/ (with slash)
    location = /pbkk-b-7/ {
        rewrite ^ / last;
    }

    # 3. Handle all other requests, e.g., /pbkk-b-7/chat
    location /pbkk-b-7/ {
        # This strips the prefix:
        # e.g., /pbkk-b-7/chat -> /chat
        # e.g., /pbkk-b-7/build/app.css -> /build/app.css
        rewrite ^/pbkk-b-7/(.*)$ /$1 last;
    }
    # --- END NEW SECTION ---

    # This block is unchanged
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # This block is unchanged
    location ~ /\.env {
        deny all;
    }
}